plugins {
    id 'java'
    id 'application'
}

group = 'org.teamsports'
version = '0.1.0'

// Target Java 17 bytecode; builds with any JDK 17+
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    // HTTP client for external APIs (course DB API, Open-Meteo, Nominatim)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // JSON parsing
    implementation 'org.json:json:20240303'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'app.Main'
}

tasks.named('run', JavaExec) {
    systemProperty 'teamsports.data', providers.gradleProperty('appData').getOrElse('data/app-data.json')
}

tasks.register('seedDemo', JavaExec) {
    group = 'application'
    description = 'Create a separate presentation store without replacing existing data.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'app.DemoDataSeeder'
    args providers.gradleProperty('demoData').getOrElse('data/demo-data.json')
}

test {
    useJUnitPlatform {
        // Tests tagged "network" need internet access, so they are skipped by
        // default and the suite stays deterministic. Run them with:
        //   gradlew test -Pnetwork
        if (!project.hasProperty('network')) {
            excludeTags 'network'
        }
    }
}
